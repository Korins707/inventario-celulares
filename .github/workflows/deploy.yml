name: Deploy

# Publicacion continua: imagen del backend en Azure Container Registry
# y frontend estatico en Vercel.
# Requiere secrets ver README > Configuracion de secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: inventarioapi
  RESOURCE_GROUP: rg-inventario-celulares

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar y probar el backend
        working-directory: backend
        run: |
          dotnet restore InventarioCelulares.sln
          dotnet build InventarioCelulares.sln --configuration Release --no-restore
          dotnet test InventarioCelulares.sln --configuration Release --no-build --verbosity normal

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-backend:
    name: Desplegar backend (Azure Container Registry)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Verificar credenciales de Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::Faltan los secrets de Azure: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID."
            echo "::error::Consulta el README, seccion Configuracion de secrets."
            exit 1
          fi

      - name: Iniciar sesion en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir la imagen del backend
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f Dockerfile .

      - name: Autenticar en Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password "${{ secrets.ACR_PASSWORD }}"

      - name: Etiquetar y publicar la imagen
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Desplegar en Azure Container Instances
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          az container delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name inventario-api \
            --yes 2>/dev/null || true

          az container create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name inventario-api \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "inventario-api-${{ github.run_number }}" \
            --port 8080 \
            --restart-policy OnFailure \
            --environment-variables \
                ASPNETCORE_ENVIRONMENT=Production \
                ASPNETCORE_URL=http://+:8080 \
                ConnectionStrings__DefaultConnection="$CONNECTION_STRING" \
                Cors__AllowedOrigins__0="$FRONTEND_URL"

      - name: Mostrar la URL del backend
        run: |
          URL=$(az container show --resource-group "${{ env.RESOURCE_GROUP }}" --name inventario-api --query ipAddress.fqdn --output tsv)
          echo "API publicada en: https://$URL"
          echo "API_URL=https://$URL" >> "$GITHUB_ENV"

  deploy-frontend:
    name: Desplegar frontend (Vercel)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Verificar token de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secret VERCEL_TOKEN en GitHub Actions."
            exit 1
          fi

      - name: Publicar el frontend en Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: frontend

  resumen:
    name: Resumen del despliegue
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Publicar las URLs
        run: |
          {
            echo "## Despliegue completado"
            echo ""
            echo "- Repositorio: ${{ github.server_url }}/${{ github.repository }}"
            echo "- Frontend: ${{ secrets.FRONTEND_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"